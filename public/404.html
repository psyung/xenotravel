<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>XenoTravel · 404</title>
  <link rel="icon" type="image/svg+xml" href="/icons/logo-xeno-route.svg">
  <style>
    /* 앱 스타일시트 없이도 보이게 최소 토큰만 (차콜 + 테라코타 코랄) */
    :root { --bg: #FAF9F6; --paper: #FFFFFF; --ink: #18181B; --sub: #52525B; --line: #E4E4E7; --accent: #D94E34; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121214; --paper: #1C1C1F; --ink: #F4F4F5; --sub: #A1A1AA; --line: #2E2E33; --accent: #F2745B; color-scheme: dark; } }
    :root[data-theme="dark"] { --bg: #121214; --paper: #1C1C1F; --ink: #F4F4F5; --sub: #A1A1AA; --line: #2E2E33; --accent: #F2745B; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
      font: 15px/1.6 Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "PingFang SC", "Hiragino Sans", sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
    main { width: min(440px, 100%); background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; }
    .mark { width: 40px; height: 40px; color: var(--ink); }
    .code { margin: 14px 0 2px; color: var(--accent); font-weight: 800; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    h1 { margin: 0 0 8px; font-size: 21px; line-height: 1.35; }
    p { margin: 0 0 20px; color: var(--sub); }
    a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 12px; background: var(--ink); color: var(--paper); font-weight: 700; text-decoration: none; }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M9.5 10.5C14.5 10.5 17.5 23.5 23 23.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M11.3 21.7L19.6 13.4" stroke="currentColor" stroke-width="3.2" stroke-linecap="butt"/><circle cx="9.5" cy="23.5" r="2.6" stroke="currentColor" stroke-width="2.4"/><circle cx="23.3" cy="9.7" r="3.4" fill="var(--accent)"/></svg>
    <p class="code">404</p>
    <h1 id="h">페이지나 공유 링크를 찾을 수 없어요</h1>
    <p id="p">주소가 잘못되었거나 만료된 공유 링크예요. 보낸 사람에게 링크를 다시 받아 주세요. 내 여행은 이 브라우저에 그대로 있어요.</p>
    <a class="btn" id="a" href="/">XenoTravel 홈으로</a>
  </main>
  <script>
    // 앱과 같은 언어·밝기 (저장값 → 브라우저 언어). 앱 파일 없이 동작해야 해서 문구를 여기에 둔다.
    (function () {
      var T = {
        en: ['Page or shared link not found', 'The address is wrong or the shared link has expired. Ask the sender for a new link. Your own trips are still saved in this browser.', 'Go to XenoTravel home', 'en'],
        zh: ['找不到该页面或分享链接', '地址有误或分享链接已失效。请向发送者重新索取链接。你的行程仍保存在此浏览器中。', '返回 XenoTravel 首页', 'zh-Hans'],
        ja: ['ページまたは共有リンクが見つかりません', 'アドレスが間違っているか、共有リンクの期限が切れています。送信者にもう一度リンクをもらってください。あなたの旅行はこのブラウザに保存されたままです。', 'XenoTravel ホームへ', 'ja'],
      };
      var l = null;
      try { l = localStorage.getItem('xenotravel:lang'); } catch (e) {}
      if (!l) { var n = (navigator.language || '').toLowerCase(); l = n.indexOf('zh') === 0 ? 'zh' : n.indexOf('ja') === 0 ? 'ja' : n.indexOf('ko') === 0 ? 'ko' : 'en'; }
      var s = T[l];
      if (s) {
        document.documentElement.lang = s[3];
        document.getElementById('h').textContent = s[0];
        document.getElementById('p').textContent = s[1];
        document.getElementById('a').textContent = s[2];
      }
      try {
        var th = JSON.parse(localStorage.getItem('xenotravel:prefs') || '{}').theme;
        if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
      } catch (e) {}
    })();
  </script>
</body>
</html>
